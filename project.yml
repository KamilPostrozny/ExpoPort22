# Throwaway feasibility probe: can a free Apple ID + xtool on Linux sideload a watchOS app?
# An iOS host app embeds a single-target (SwiftUI) watch app; nothing here belongs to Port22.
name: WatchProbe
options:
  bundleIdPrefix: com.kamilpostrozny
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
targets:
  WatchProbe:
    type: application
    platform: iOS
    sources: [iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: WatchProbe
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilpostrozny.watchprobe
    dependencies:
      - target: WatchProbeWatch
  WatchProbeWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: WatchProbe
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kamilpostrozny.watchprobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilpostrozny.watchprobe.watchkitapp
