plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ssh'
version = '0.1.0'

android {
  namespace "expo.modules.ssh"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.hierynomus:sshj:0.40.0"
  // sshj's POM already pulls bcprov transitively; explicit because SSHSession.kt imports it
  // directly (provider swap + Ed25519 public-from-seed).
  implementation "org.bouncycastle:bcprov-jdk18on:1.80"
}
