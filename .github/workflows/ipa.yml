name: IPA

# The whole iOS loop for a Linux desktop: this repo cannot build the *iOS* half locally (no Xcode,
# no CocoaPods — Android builds fine on the box, which is why it has no workflow of its own; see
# docs/ship.md), so CI builds an unsigned IPA per branch and the laptop signs it with the free
# Apple ID and pushes it to the phone (docs/ship.md, scripts/install-variant.sh). Signing does not
# happen here: it would need a paid account's certificate in a secret, and free provisioning holds
# exactly one certificate that xtool owns.
#
# Two variants, one per branch, coexisting on the phone:
#
#   main → Release, JS embedded        → `prod` prerelease → Port22 (release)
#   dev  → Debug dev client (Metro)    → `dev`  prerelease → Port22-dev
#
# Both are GATED, and the gate answers one of three modes:
#
#   full    → `package` on macos-26: prebuild + xcodebuild, the only native-build authority.
#   reembed → main only, `reembed` on ubuntu-latest (~2 min instead of ~15): the release IPA
#             embeds its JS, so a JS-only push still needs a new IPA — but only its JS half.
#             scripts/reembed-js.sh rebuilds `main.jsbundle`/`www.bundle`/`assets` exactly as
#             Xcode's bundle phase does and swaps them into the current `prod` IPA.
#   none    → dev only: a JS-only push changes no IPA; the dev client picks it up from Metro.
#
# main's decision is `@expo/fingerprint`'s iOS hash of HEAD against the `fingerprint.json` that
# `prod` was built with: reembed ONLY on an exact match, full on anything else (a different hash,
# a missing asset, a download error, a workflow change since the native base). Linux cannot do
# the full build — xtool builds only SwiftPM packages, and actool/ibtool have no Linux producer
# (docs/ship.md §5). A slice is merged to main only after it has been tested on the phone as
# Port22-dev.
on:
  pull_request:
  push:
    branches: [main, dev]
    # Docs-only commits do not change the IPA, and a run is ~15 minutes of waiting.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Xcode version on the runner (26.6, 26.5, 26.4.1, 26.3, 26.2, 26.1.1, 26.0.1)'
        default: '26.6'
      force_build:
        description: 'Bypass the native-change gate (a dispatch on dev still builds otherwise)'
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

  gate:
    needs: [checks]
    # Pull requests validate code but never package or publish an IPA.
    if: github.event_name != 'pull_request'
    # Runs after checks on shipping events (~10-30 seconds on ubuntu-latest), and says WHY it
    # decided what it did. force_build short-circuits to full. One gate for both branches, not
    # conditional jobs: a package job that referenced the gate's outputs through a skipped gate
    # was skipped itself on main (2026-09-13), so the gate always runs and answers a mode.
    name: Needs a native build?
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      # reembed only: the native base's fingerprint hash and commit, so the job can check that
      # `prod` has not moved since, and name the base in its release notes.
      base_fingerprint: ${{ steps.gate.outputs.base_fingerprint }}
      native_sha: ${{ steps.gate.outputs.native_sha }}
    env:
      BRANCH: ${{ github.ref_name }}
      FORCE: ${{ inputs.force_build }}
      GH_TOKEN: ${{ github.token }}
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff is against this push's base, not the branch tip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - id: gate
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "force_build — building anyway"
            mode=full
          elif [ "$BRANCH" = "main" ]; then
          # Fail safe: every branch below that is not a confirmed exact match leaves this at full.
          mode=full
          base="$RUNNER_TEMP/prod"
          mkdir -p "$base"
          if ! gh release download prod -p fingerprint.json -D "$base"; then
            echo "prod has no fingerprint.json (or the download failed) — full build"
          elif ! native_sha=$(gh release view prod --json body -q .body \
                   | sed -n 's/^native-sha: \([0-9a-f]\{40\}\)$/\1/p' | head -n1) \
               || [ -z "$native_sha" ]; then
            echo "prod's notes name no native-sha — full build"
          elif ! git cat-file -e "$native_sha^{commit}" 2>/dev/null; then
            echo "native base $native_sha is not in this history — full build"
          elif ! git diff --quiet "$native_sha" HEAD -- .github/workflows/; then
            # The fingerprint cannot see how the package job builds (Xcode pin, flags).
            echo "workflows changed since native base $native_sha — full build"
          else
            bun install --frozen-lockfile
            # Same command, same inputs as the package job: a clean checkout, before prebuild.
            bunx @expo/fingerprint fingerprint:generate --platform ios > "$RUNNER_TEMP/head.json"
            base_fingerprint=$(node -p 'require(process.argv[1]).hash' "$base/fingerprint.json")
            head_fingerprint=$(node -p 'require(process.argv[1]).hash' "$RUNNER_TEMP/head.json")
            echo "native fingerprint: prod $base_fingerprint (built from $native_sha), HEAD $head_fingerprint"
            if [ -n "$base_fingerprint" ] && [ "$base_fingerprint" = "$head_fingerprint" ]; then
              echo "native half unchanged since $native_sha — re-embed this push's JS into prod"
              mode=reembed
              echo "base_fingerprint=$base_fingerprint" >> "$GITHUB_OUTPUT"
              echo "native_sha=$native_sha" >> "$GITHUB_OUTPUT"
            else
              echo "native change — full build. Sources that differ:"
              node -e '
                const [a, b] = process.argv.slice(1).map((p) => require(p).sources);
                const key = (s) => s.filePath ?? s.id ?? JSON.stringify(s.contents ?? "");
                const m = (l) => new Map(l.map((s) => [key(s), s.hash]));
                const [ma, mb] = [m(a), m(b)];
                for (const k of new Set([...ma.keys(), ...mb.keys()]))
                  if (ma.get(k) !== mb.get(k)) console.log("  " + k);
              ' "$base/fingerprint.json" "$RUNNER_TEMP/head.json" || true
            fi
          fi
          else
          # The push's own diff: a plain commit against its parent, a merge against the merge
          # base so the merged side's changes count too.
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ge 3 ]; then
            base=$(git merge-base HEAD^1 HEAD^2)
          else
            base=$(git rev-parse HEAD~1)
          fi
          mapfile -t files < <(git diff --name-only "$base" HEAD)
          printf 'changed files: %s\n' "${files[*]:-<none>}"

          build=false
          for f in "${files[@]}"; do
            case "$f" in
              app.json|modules/*|ios/*|patches/*|.github/workflows/*)
                echo "native change: $f"
                build=true
                ;;
            esac
          done

          # package.json / bun.lock: only when a dependency with native code changed. A pure-JS
          # dependency (or a scripts-only package.json edit) changes no IPA.
          if [ "$build" = false ] && printf '%s\n' "${files[@]}" | grep -qE '^(package\.json|bun\.lock)$'; then
            git show "$base:package.json" > base-pkg.json 2>/dev/null || echo '{}' > base-pkg.json
            changed_deps=$(bun -e '
              const fs = require("node:fs");
              const m = (j) => ({ ...(j.dependencies || {}), ...(j.devDependencies || {}), ...(j.peerDependencies || {}) });
              const a = m(JSON.parse(fs.readFileSync("base-pkg.json", "utf8")));
              const b = m(JSON.parse(fs.readFileSync("package.json", "utf8")));
              for (const n of new Set([...Object.keys(a), ...Object.keys(b)]))
                if (a[n] !== b[n]) console.log(n);
            ')
            if [ -n "$changed_deps" ]; then
              bun install --frozen-lockfile
              while IFS= read -r dep; do
                [ -z "$dep" ] && continue
                if [ -d "node_modules/$dep/ios" ]; then
                  echo "native dep changed: $dep"
                  build=true
                elif ! grep -qF "\"$dep\"" package.json; then
                  # Removed between base and HEAD: cannot cheaply check the old copy was native — build.
                  echo "dep removed (native?): $dep"
                  build=true
                fi
              done <<<"$changed_deps"
            elif printf '%s\n' "${files[@]}" | grep -qx 'bun.lock'; then
              # Lockfile-only drift (bun update, a transitive bump): the package.json diff cannot
              # see a transitive native change, so build.
              echo "bun.lock changed with no package.json dep change"
              build=true
            fi
          fi
          if [ "$build" = true ]; then mode=full; else
            echo "no native change — no build (JS-only rides Metro)"
            mode=none
          fi
          fi

          echo "mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  package:
    # macos-26, not macos-15, for Xcode 26.6 alone: it is the image EAS uses for SDK 57, and
    # anything older (26.2 and 26.3 both tried) cannot type-check expo-modules-jsi's own
    # `JavaScriptCodable+Date.swift`, which every SDK 57 build compiles into an xcframework.
    runs-on: macos-26
    needs: [gate]
    # After checks, the gate is the single native-build decision point for both shipping branches.
    if: needs.gate.outputs.mode == 'full'
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than inherited even though 26.6 is currently the default, so an image bump
      # cannot silently move the toolchain. A dispatch input, because finding a working version is
      # guesswork from a machine with no Xcode on it.
      - run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode || '26.6' }}.app"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The dev variant is a different app: its own name, bundle id and URL scheme, so it
      # coexists on the phone with the release build (which keeps com.kamilpostrozny.port22 and
      # the expoport22 scheme). app.json stays the source of truth for main; the rewrite happens
      # here, after checkout, and is never committed.
      - name: Apply the dev variant
        if: env.BRANCH == 'dev'
        run: |
          bun -e '
            const fs = require("node:fs");
            const p = "app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.name = "Port22-dev";
            j.expo.scheme = "expoport22dev";
            j.expo.ios.bundleIdentifier = "com.kamilpostrozny.port22.dev";
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '

      # What the IPA's native half is built from, published beside it for the gate's next
      # comparison. Here, not after the build: after "Apply the dev variant" (its app.json is part
      # of the hash) but before prebuild, which writes ios/ and rewrites package.json's scripts —
      # both hashed, and absent from the gate's clean checkout.
      - name: Record the native fingerprint
        run: bunx @expo/fingerprint fingerprint:generate --platform ios > "$RUNNER_TEMP/fingerprint.json"

      # `ios/` is generated, never committed — the app.json plugins are the source of truth for it.
      # This is also the step that resolves Citadel: `pod install` writes the Swift package
      # references that ExpoSSH.podspec declares.
      - run: bunx expo prebuild -p ios

      # The configuration follows the branch:
      #
      #   main → Release. `#if DEBUG` in the generated AppDelegate is what picks the Metro URL;
      #     Release returns the embedded `main.jsbundle`, so `__DEV__` is false and React runs
      #     `ReactFabric-prod.js` instead of the dev renderer, with no per-element
      #     `__source`/`__self` debug objects. The "Bundle React Native code and images" phase
      #     runs `expo export:embed`, which is also what writes `www.bundle` — the DOM
      #     component's HTML. Without it the terminal's webview has nothing to load, which is
      #     exactly why `expo start --no-dev` renders a blank terminal against a Debug client
      #     and cannot be used to measure this app (2026-08-13).
      #   dev  → Debug. That is a dev client which loads its JS from Metro over the LAN, the
      #     daily loop (docs/ship.md).
      #
      # Every frame-rate number this project has was taken on a Debug bundle, so it carries an
      # unknown constant. A Release build from main is how to get one that does not.
      - name: Build and package an unsigned IPA
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then CONFIG=Release; else CONFIG=Debug; fi
          workspace=$(ls -d ios/*.xcworkspace)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration "$CONFIG" -sdk iphoneos -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R "build/Build/Products/$CONFIG-iphoneos/$scheme.app" Payload/
          # The embedded bundle is the whole point of a Release build — fail loudly rather than
          # shipping an app whose webview will come up blank on the phone.
          if [ "$CONFIG" = "Release" ]; then
            test -f "Payload/$scheme.app/main.jsbundle" || { echo "no main.jsbundle — export:embed did not run"; exit 1; }
            test -d "Payload/$scheme.app/www.bundle" || { echo "no www.bundle — the DOM component would load nothing"; exit 1; }
          fi
          zip -qry Port22.ipa Payload

      # One URL that is always the latest build. Delete-then-create rather than clobber-in-place, so
      # the tag points at the commit that was actually built.
      # Before the release, not after: the IPA exists only on the runner, and a release API that
      # answers HTTP 500 (it did, 2026-08-13) otherwise costs a fresh 15-minute build to get back
      # a binary that had already been built successfully.
      - name: Keep the IPA whatever the release API does
        uses: actions/upload-artifact@v4
        with:
          name: Port22-${{ github.ref_name == 'main' && 'release' || 'dev' }}-ipa
          path: Port22.ipa
          retention-days: 7

      # Two rolling tags, not one: each is the latest build of its branch, and neither may ever
      # replace the other — `prod` is the release the phone runs, `dev` the client it develops
      # against. `native-sha:` is machine-read by the gate: a later re-embed keeps this build's
      # native half, so it must name this commit separately from its own JS commit.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            tag=prod
            title="release — latest main"
            notes="Unsigned **Release** build of ${GITHUB_SHA} from main: JS is embedded (\`main.jsbundle\` + \`www.bundle\`), \`__DEV__\` is false, Metro is not involved. Install with \`scripts/install-variant.sh release\` and just launch it — do NOT start a bundler for it. Use \`dev\` to develop."
          else
            tag=dev
            title="dev — latest dev branch"
            notes="Unsigned **Debug** dev-client build of ${GITHUB_SHA} from dev: \`Port22-dev\`, bundle \`com.kamilpostrozny.port22.dev\`. Rolling: every native-changing push to dev replaces it. Install with \`scripts/install-variant.sh dev\`; needs \`bunx expo start --dev-client\` running."
          fi
          notes+=$'\n\n'"native-sha: ${GITHUB_SHA}"$'\n'"js-sha: ${GITHUB_SHA}"
          scripts/publish-release.sh "$tag" "$title" "$notes" Port22.ipa "$RUNNER_TEMP/fingerprint.json"

  reembed:
    # main's JS-only push: the native half of `prod` is still right (the gate matched its
    # fingerprint exactly), so rebuild only the JS on Linux and swap it in — ~2 minutes instead of
    # a ~15-minute macos-26 build. scripts/reembed-js.sh holds the rebuild, the Hermes bytecode
    # guard and the Release assertions; local installs use the same script.
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.mode == 'reembed'
    env:
      GH_TOKEN: ${{ github.token }}
      HUSKY: '0'
      BASE_FINGERPRINT: ${{ needs.gate.outputs.base_fingerprint }}
      NATIVE_SHA: ${{ needs.gate.outputs.native_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile

      - name: Download the native base
        run: |
          set -euo pipefail
          gh release download prod -p Port22.ipa -p fingerprint.json -D base
          # The gate compared against this asset; refuse if `prod` moved in between.
          got=$(node -p 'require("./base/fingerprint.json").hash')
          if [ "$got" != "$BASE_FINGERPRINT" ]; then
            echo "prod changed since the gate ($BASE_FINGERPRINT → $got) — re-run the workflow"
            exit 1
          fi

      - name: Re-embed this commit's JS
        run: scripts/reembed-js.sh base/Port22.ipa Port22.ipa

      - name: Keep the IPA whatever the release API does
        uses: actions/upload-artifact@v4
        with:
          name: Port22-release-ipa
          path: Port22.ipa
          retention-days: 7

      # The base's fingerprint.json goes back unchanged: it still describes the native half.
      - name: Publish
        run: |
          set -euo pipefail
          notes="Unsigned **Release** IPA from main: the JS of ${GITHUB_SHA} (\`main.jsbundle\` + \`www.bundle\` + \`assets\`, re-embedded on Linux by \`scripts/reembed-js.sh\`) on the native build of ${NATIVE_SHA}, whose native fingerprint it matches. \`__DEV__\` is false, Metro is not involved. Install with \`scripts/install-variant.sh release\` and just launch it — do NOT start a bundler for it. Use \`dev\` to develop."
          notes+=$'\n\n'"native-sha: ${NATIVE_SHA}"$'\n'"js-sha: ${GITHUB_SHA}"
          scripts/publish-release.sh prod "release — latest main" "$notes" Port22.ipa base/fingerprint.json
