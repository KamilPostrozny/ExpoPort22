name: IPA

# The whole iOS loop for a Linux desktop: this repo cannot build the *iOS* half locally (no Xcode,
# no CocoaPods — Android builds fine on the box, which is why it has no workflow of its own; see
# docs/ship.md), so every push to `main` produces an unsigned Debug IPA and replaces the rolling `dev`
# prerelease. `xtool install` on the laptop signs it with the free Apple ID and pushes it to the
# phone — see docs/ship.md. Signing does not happen here: it would need a paid account's
# certificate in a secret, and free provisioning holds exactly one certificate that xtool owns.
on:
  push:
    branches: [main]
    # Docs-only commits do not change the IPA, and a run is ~15 minutes of waiting.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Xcode version on the runner (26.6, 26.5, 26.4.1, 26.3, 26.2, 26.1.1, 26.0.1)'
        default: '26.6'
      configuration:
        description: 'Debug = dev client fed by Metro (the daily loop). Release = the real thing, JS embedded.'
        default: 'Debug'
        type: choice
        options: ['Debug', 'Release']

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    # macos-26, not macos-15, for Xcode 26.6 alone: it is the image EAS uses for SDK 57, and
    # anything older (26.2 and 26.3 both tried) cannot type-check expo-modules-jsi's own
    # `JavaScriptCodable+Date.swift`, which every SDK 57 build compiles into an xcframework.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than inherited even though 26.6 is currently the default, so an image bump
      # cannot silently move the toolchain. A dispatch input, because finding a working version is
      # guesswork from a machine with no Xcode on it.
      - run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode || '26.6' }}.app"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # `ios/` is generated, never committed — the app.json plugins are the source of truth for it.
      # This is also the step that resolves Citadel: `pod install` writes the Swift package
      # references that ExpoSSH.podspec declares.
      - run: bunx expo prebuild -p ios

      # Debug by default: that is a dev client which loads its JS from Metro over the LAN, which is
      # the daily loop (docs/ship.md). Release is the on-demand one, and it is a different app in
      # every way that matters to a measurement:
      #
      #   - `#if DEBUG` in the generated AppDelegate picks the Metro URL; Release returns the
      #     embedded `main.jsbundle`, so `__DEV__` is false and React runs `ReactFabric-prod.js`
      #     instead of the dev renderer, with no per-element `__source`/`__self` debug objects.
      #   - The "Bundle React Native code and images" phase runs `expo export:embed`, which is also
      #     what writes `www.bundle` — the DOM component's HTML. Without it the terminal's webview
      #     has nothing to load, which is exactly why `expo start --no-dev` renders a blank
      #     terminal against a Debug client and cannot be used to measure this app (2026-08-13).
      #
      # Every frame-rate number this project has was taken on a Debug bundle, so it carries an
      # unknown constant. This is how to get one that does not.
      - name: Build and package an unsigned IPA
        env:
          CONFIG: ${{ inputs.configuration || 'Debug' }}
        run: |
          set -euo pipefail
          workspace=$(ls -d ios/*.xcworkspace)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration "$CONFIG" -sdk iphoneos -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R "build/Build/Products/$CONFIG-iphoneos/$scheme.app" Payload/
          # The embedded bundle is the whole point of a Release build — fail loudly rather than
          # shipping an app whose webview will come up blank on the phone.
          if [ "$CONFIG" = "Release" ]; then
            test -f "Payload/$scheme.app/main.jsbundle" || { echo "no main.jsbundle — export:embed did not run"; exit 1; }
            test -d "Payload/$scheme.app/www.bundle" || { echo "no www.bundle — the DOM component would load nothing"; exit 1; }
          fi
          zip -qry Port22.ipa Payload

      # One URL that is always the latest build. Delete-then-create rather than clobber-in-place, so
      # the tag points at the commit that was actually built.
      # Before the release, not after: the IPA exists only on the runner, and a release API that
      # answers HTTP 500 (it did, 2026-08-13) otherwise costs a fresh 15-minute build to get back
      # a binary that had already been built successfully.
      - name: Keep the IPA whatever the release API does
        uses: actions/upload-artifact@v4
        with:
          name: Port22-${{ inputs.configuration || 'Debug' }}-ipa
          path: Port22.ipa
          retention-days: 7

      # Two rolling tags, not one: a Release build must not replace the dev client the daily loop
      # installs from, and a push to main must not replace a Release build somebody is mid-way
      # through testing. `dev` is the automatic one, `prod` only ever appears on a dispatch.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.configuration || 'Debug' }}
        run: |
          set -euo pipefail
          if [ "$CONFIG" = "Release" ]; then
            tag=prod
            title="prod — Release, JS embedded"
            notes="Unsigned **Release** build of ${GITHUB_SHA}: JS is embedded (\`main.jsbundle\` + \`www.bundle\`), \`__DEV__\` is false, Metro is not involved. Install with \`xtool install\` and just launch it — do NOT start a bundler for it. Use this to measure; use \`dev\` to develop."
          else
            tag=dev
            title="dev — latest main"
            notes="Unsigned Debug dev-client build of ${GITHUB_SHA}. Rolling: every push to main replaces it. Needs \`bunx expo start --dev-client\` running. Install with \`xtool install\`."
          fi
          gh release delete "$tag" --yes --cleanup-tag || true
          # The delete and the create race: deleting the tag is not instant on GitHub's side, and
          # creating one over it came back HTTP 500 (2026-08-13). Retry rather than throw away a
          # build that succeeded — the artifact above is the backstop if even this gives up.
          for attempt in 1 2 3; do
            if gh release create "$tag" Port22.ipa --prerelease --target "${GITHUB_SHA}" \
                 --title "$title" --notes "$notes"; then
              exit 0
            fi
            echo "release create failed (attempt $attempt) — waiting"
            sleep 15
          done
          echo "could not publish; the IPA is on this run as an artifact"
          exit 1
